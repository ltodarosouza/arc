name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  account-qa:
    name: Verify local account lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start disposable Supabase without printing credentials
        run: |
          supabase start > /tmp/arc-supabase-start.log 2>&1
          supabase status -o env > .env.supabase-test
          node scripts/prepare-account-qa.mjs
      - name: Start Arc
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/arc-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/account > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify real local email and private account lifecycle
        env:
          ARC_ACCOUNT_QA: '1'
        run: node --env-file=.env.local node_modules/@playwright/test/cli.js test --config playwright.account.config.ts
      - name: Stop disposable services
        if: always()
        run: supabase stop --no-backup

  verify:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format -- --check
      - run: npm run lint:core
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  content-verification:
    name: Verify authored mathematics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install sympy==1.14.0
      - run: node scripts/build-calculus-1-batch.mjs --check
      - run: node scripts/build-calculus-1-batch.mjs --batch=02 --check
      - run: node scripts/build-calculus-1-batch.mjs --batch=03 --check
      - run: node scripts/build-calculus-1-batch.mjs --batch=04 --check
      - run: node scripts/build-calculus-1-batch.mjs --batch=05 --check
      - run: node scripts/build-calculus-1-batch.mjs --batch=06 --check
      - run: node scripts/build-calculus-1-batch.mjs --batch=07 --check
      - run: node scripts/build-vector-calculus-batch.mjs --batch=01 --check
      - run: node scripts/build-vector-calculus-batch.mjs --batch=02 --check
      - run: node scripts/build-vector-calculus-batch.mjs --batch=03 --check
      - run: node scripts/build-vector-calculus-batch.mjs --batch=04 --check
      - run: node scripts/build-vector-calculus-batch.mjs --batch=05 --check
      - run: node scripts/build-vector-calculus-batch.mjs --batch=06 --check
      - run: node scripts/build-vector-calculus-batch.mjs --batch=07 --check
      - run: node scripts/build-vector-calculus-batch.mjs --batch=08 --check
      - run: node scripts/build-refreshed-vector-calculus-batch.mjs --batch=01 --check
      - run: node scripts/build-refreshed-vector-calculus-batch.mjs --batch=02 --check
      - run: node scripts/build-refreshed-vector-calculus-batch.mjs --batch=03 --check
      - run: node scripts/build-refreshed-vector-calculus-batch.mjs --batch=04 --check
      - run: node scripts/build-refreshed-vector-calculus-batch.mjs --batch=05 --check
      - run: node scripts/build-content-batches.mjs --check
      - run: python scripts/verify-content.py

  migration-preflight:
    name: Validate database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arc_preflight
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arc_preflight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: arc_preflight
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Supabase compatibility stubs
        run: |
          psql -v ON_ERROR_STOP=1 -c "create schema auth;"
          psql -v ON_ERROR_STOP=1 -c "create table auth.users (id uuid primary key);"
          psql -v ON_ERROR_STOP=1 -c "create function auth.uid() returns uuid language sql stable as 'select nullif(current_setting(''request.jwt.claim.sub'', true), '''')::uuid';"
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin;"
          psql -v ON_ERROR_STOP=1 -c "create role authenticated nologin;"
          psql -v ON_ERROR_STOP=1 -c "grant usage on schema auth to authenticated, anon;"
      - name: Apply every migration in order
        run: |
          for migration in $(find supabase/migrations -type f -name '*.sql' | sort); do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Check private profiles and unpublished content
        run: |
          for test in supabase/tests/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$test"
          done
