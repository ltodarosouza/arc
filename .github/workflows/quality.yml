name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format -- --check
      - run: npm run lint:core
      - run: npm test
      - run: npm run build
